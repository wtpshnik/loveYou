<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love Heart</title>
<style>html,body{margin:0;height:100%;background:#060208;overflow:hidden}canvas{display:block;width:100vmin;height:100vmin;margin:auto;position:absolute;inset:0}</style>
</head><body><canvas id="c"></canvas><script>
const SC=21,OY=20,DURATION=10,ANIM=42,LIFT=34,GAP=7,SIZES=[9,10,11,12],BG="#060208",W=800;
const PX=4/3; // tk points -> css px
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const dpr=Math.min(devicePixelRatio||1,3);
function fit(){const s=Math.min(innerWidth,innerHeight);cv.width=cv.height=Math.round(s*dpr);}
fit();addEventListener("resize",()=>{fit();});
// seeded rng (mulberry32)
let seed=11;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const uni=(a,b)=>a+(b-a)*rnd(),choice=a=>a[Math.floor(rnd()*a.length)];
const PHRASES=["I love you","Seni seviyorum","Te amo","Je t'aime","Ich liebe dich","Ti amo","Eu te amo","Я тебя люблю","사랑해","愛してる","我爱你","मैं तुमसे प्यार करता हूँ","Σ' αγαπώ","Ik hou van jou","Jag älskar dig","Kocham cię","ฉันรักเธอ","Anh yêu em","Aku cinta kamu","Я тебе кохаю"];
const fnt=s=>`bold ${s*PX}px Arial, sans-serif`;
// measure in logical units: ctx is scaled by k at draw; measure unscaled at logical size
const mc=document.createElement("canvas").getContext("2d");
const meas=(t,s)=>{mc.font=fnt(s);return mc.measureText(t).width};
const heart=a=>[16*Math.sin(a)**3*SC,(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*SC+OY];
const mix=(a,b,k)=>a.map((p,i)=>p+(b[i]-p)*k),dim=(c,k)=>c.map(v=>v*k);
const clamp=v=>Math.max(0,Math.min(1,v));
const hx=c=>"#"+c.map(v=>Math.round(clamp(v)*255).toString(16).padStart(2,"0")).join("");
const POLY=Array.from({length:720},(_,i)=>heart(2*Math.PI*i/720));
const EDGES=POLY.map((p,i)=>[p,POLY[(i+1)%720]]);
const YMAX=Math.max(...POLY.map(p=>p[1])),YMIN=Math.min(...POLY.map(p=>p[1])),CY=(YMAX+YMIN)/2;
function spans(y){const xs=[];for(const[[x1,y1],[x2,y2]]of EDGES)if((y1<=y&&y<y2)||(y2<=y&&y<y1))xs.push(x1+(y-y1)*(x2-x1)/(y2-y1));xs.sort((a,b)=>a-b);const o=[];for(let i=0;i+1<xs.length;i+=2)o.push([xs[i],xs[i+1]]);return o}
function intersect(A,B){const o=[];for(const a of A)for(const b of B){const lo=Math.max(a[0],b[0]),hi=Math.min(a[1],b[1]);if(hi-lo>14)o.push([lo,hi])}return o}
let q=[];const next=()=>{if(!q.length){q=PHRASES.slice();for(let i=q.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[q[i],q[j]]=[q[j],q[i]]}}return q.shift()};
function build(){
  const rowH=Math.max(...SIZES.map(z=>z*PX*1.15))+4,half=rowH/2,placed=[];
  for(let y=YMAX-half;y>YMIN+half;y-=rowH){
    for(let[lo,hi]of intersect(spans(y+half),spans(y-half))){
      lo+=4;hi-=4;let cur=lo+uni(0,8);const line=[];
      for(;;){let fit=null;
        for(let k=0;k<10;k++){const text=next(),size=choice(SIZES),w=meas(text,size);if(cur+w<=hi){fit=[text,size,w];break}}
        if(!fit)break;const[text,size,w]=fit;line.push([cur+w/2,text,size,w]);cur+=w+GAP}
      if(!line.length)continue;
      if(line.length>1){const left=hi-(line[line.length-1][0]+line[line.length-1][3]/2);line.forEach((it,i)=>it[0]+=left*i/(line.length-1))}
      else line[0][0]=(lo+hi)/2;
      line.forEach(([x,text,size],i)=>placed.push({x,y,text,size,edge:i==0||i==line.length-1}));
    }
  }
  const wine=[.58,0,.09],crimson=[.9,.05,.14],blood=[.98,.1,.16];
  for(const p of placed){
    const rad=Math.min(1,Math.hypot(p.x/(16*SC),(p.y-CY)/(14.5*SC)));
    let base=mix(wine,crimson,.25+.75*rad);
    base=mix(base,blood,uni(0,.35)+(p.edge?.3:0));
    p.color=base.map(v=>Math.min(1,v));p.rad=rad;
  }
  const edges=placed.filter(p=>p.edge).sort((a,b)=>(Math.atan2(a.x,a.y-CY)+2*Math.PI)%(2*Math.PI)-(Math.atan2(b.x,b.y-CY)+2*Math.PI)%(2*Math.PI));
  const inner=placed.filter(p=>!p.edge);inner.forEach(p=>p.k=-p.rad+uni(0,.08));inner.sort((a,b)=>a.k-b.k);
  return edges.concat(inner);
}
const BGC=[1,3,5].map(i=>parseInt(BG.substr(i,2),16)/255),FLASH=[1,.78,.78];
const ORDER=build().map(p=>({...p,f:-1,dx:uni(-10,10),flash:0}));
const RATE=ORDER.length/(DURATION*1000/16);
let acc=0,spawned=0,last=performance.now(),shimmerAt=0,shim=null;
function state(p){ // returns {px,py,col,halo,shadow}
  const u=clamp(p.f/ANIM),e=1-(1-u)**3,c=p.color;
  const x=p.x,y=-p.y,hover=(1-e)*LIFT;
  const f=.75*Math.sin(Math.PI*clamp((u-.55)/.45));
  return{u,px:x+p.dx*(1-e),py:y-hover,sx:x,sy:y,col:u>=1?c:mix(mix(BGC,c,e**1.5),FLASH,f),halo:mix(BGC,dim(c,.2),e*e),shadow:mix(BGC,dim(c,.3),e)};
}
function frame(now){
  const dt=Math.min(now-last,100);last=now;
  acc+=RATE*dt/16;while(acc>=1&&spawned<ORDER.length){acc--;ORDER[spawned++].f=0}
  for(let i=0;i<spawned;i++){const p=ORDER[i];if(p.f>=0&&p.f<ANIM)p.f+=dt/16}
  if(spawned>=ORDER.length&&ORDER[ORDER.length-1].f>=ANIM&&now>shimmerAt){
    if(shim)shim.t=0;shim={p:choice(ORDER),t:now};shimmerAt=now+140}
  const k=cv.width/W;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=BG;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(k,0,0,k,cv.width/2,cv.height/2);ctx.textAlign="center";ctx.textBaseline="middle";
  for(let i=0;i<spawned;i++){const p=ORDER[i],s=state(p),b=p.size*PX;
    if(s.u<1&&p.f<=0)continue;
    ctx.font=fnt(p.size);ctx.fillStyle=hx(s.shadow);ctx.fillText(p.text,s.sx+2,s.sy+3);
    ctx.font=fnt(p.size+1);ctx.fillStyle=hx(s.halo);ctx.fillText(p.text,s.u>=1?s.sx:s.px,s.u>=1?s.sy:s.py);
    ctx.font=fnt(p.size);let col=s.col;
    if(shim&&shim.p===p&&now-shim.t<260)col=mix(p.color,FLASH,.6);
    ctx.fillStyle=hx(col);ctx.fillText(p.text,s.u>=1?s.sx:s.px,s.u>=1?s.sy:s.py);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
